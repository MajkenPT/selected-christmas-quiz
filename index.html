<!doctype html>
<html lang="da" data-theme="cream">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Selected julequiz</title>
<meta name="description" content="Tre onsdage i december, tre gæt og tolv præmier. Quiz-nissen vågner kun om onsdagen.">
<meta name="theme-color" content="#F4EFE6">
<style>
/* Selected Christmas design tokens (tokens.json), cream + forest evening */
@font-face{font-family:"Suisse Intl Mono";src:url("fonts/SuisseIntlMono-Regular.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap}
:root{
  --surface:#F4EFE6;--paper:#FBF8F1;--ink:#000000;--ink-muted:#5B554B;
  --wine:#8B1E2D;--forest:#1F3A2E;--hat-edge:#8B1E2D;--line:#1F3A2E;
  --accent-a:#1F3A2E;--accent-b:#8B1E2D;--knit:#DED4BF;--knit-hi:#FBF8F1;
  --font-mono:"Suisse Intl Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --space-1:4px;--space-2:8px;--space-3:16px;--space-4:24px;--space-5:40px;--space-6:64px;--space-7:96px;
  --radius-slab:2px;--stroke-hairline:1.5px;--opacity-knit:.55;
  --gutter:20px;
}
:root[data-theme="forest"]{
  --surface:#1F3A2E;--paper:#F4EFE6;--ink:#F4EFE6;--ink-muted:#C9C2B0;
  --hat-edge:#F4EFE6;--line:#D8D1BF;--accent-a:#F4EFE6;--accent-b:#C9C2B0;
  --knit:#284838;--knit-hi:#3B5E4F;
}
*{box-sizing:border-box}
html{background:var(--surface);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;min-height:100dvh;position:relative;overflow-x:hidden;
  font-family:var(--font-mono);font-weight:400;font-size:18px;line-height:28px;
  color:var(--ink);background:var(--surface);
}
body.ready{transition:background-color .6s,color .6s}
h1,h2,p,ol{margin:0;padding:0;font-weight:400}
img,svg{display:block}

/* ground: knit texture, centre kept clear */
.knit{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:var(--opacity-knit);
  -webkit-mask-image:radial-gradient(ellipse 62% 56% at 50% 52%,transparent 30%,#000 100%);
          mask-image:radial-gradient(ellipse 62% 56% at 50% 52%,transparent 30%,#000 100%)}
.knit svg{width:100%;height:100%}
.knit .k{fill:none;stroke-linecap:round;stroke-linejoin:round}
.knit .k1{stroke:var(--knit);stroke-width:4.2}
.knit .k2{stroke:var(--knit-hi);stroke-opacity:.7;stroke-width:.8}

/* garland, the only motion: a slow sway */
.garland{position:absolute;top:0;left:0;right:0;z-index:3;pointer-events:none;overflow:hidden}
.garland svg{width:100%;transform-origin:50% 0;animation:sway 9s ease-in-out infinite alternate}
.garland .ln{fill:none;stroke:var(--line);stroke-width:var(--stroke-hairline);stroke-linecap:round;stroke-linejoin:round}
.garland .dot{fill:var(--line)}
.garland .bb{fill:none;stroke:var(--accent-b);stroke-width:var(--stroke-hairline);stroke-linejoin:round}
.garland .bb.fill{fill:var(--accent-b)}
@keyframes sway{from{transform:skewX(-1.1deg)}to{transform:skewX(1.1deg)}}
@media (prefers-reduced-motion:reduce){.garland svg{animation:none}body{transition:none}}

/* corner snowflakes */
.flake{color:var(--accent-a);fill:currentColor;flex:none}
.corner{position:absolute;z-index:1;pointer-events:none}
.corner.big{left:var(--gutter);bottom:28px;width:104px;height:104px}
.corner.small{right:calc(var(--gutter) + 6px);bottom:92px;width:56px;height:56px}
.divider{width:44px;height:44px;margin:var(--space-4) auto 0;color:var(--accent-b)}

/* layout */
.stage{position:relative;z-index:2;max-width:640px;margin:0 auto;padding:clamp(96px,17vw,150px) var(--gutter) 200px;text-align:center}
.logo{width:min(76vw,430px);height:auto;margin:0 auto}
.head{margin-top:clamp(32px,7vw,var(--space-6))}
.label{font-size:13px;line-height:16px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted)}
.headline{font-size:clamp(25px,6.6vw,38px);line-height:1.22;letter-spacing:.01em;margin-top:var(--space-3);text-wrap:balance}
.body{font-size:18px;line-height:28px;margin:var(--space-3) auto 0;max-width:34ch;text-wrap:balance}
.caption{font-size:14px;line-height:20px;color:var(--ink-muted);margin:var(--space-3) auto 0;max-width:42ch;text-wrap:balance}
.prize{margin-top:var(--space-4)}
.prize .name{display:block;margin-top:var(--space-1);font-size:18px;line-height:28px;letter-spacing:0;text-transform:none;color:var(--ink)}
.zzz{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin-top:var(--space-4);color:var(--ink-muted);line-height:1}
.zzz span:nth-child(1){font-size:18px}
.zzz span:nth-child(2){font-size:28px;transform:translateY(-8px)}
.zzz span:nth-child(3){font-size:42px;transform:translateY(-18px)}
.zzz{padding-bottom:18px}

/* alarm clock, built from the system's own marks: hairline frame, two baubles for bells */
.alarm{margin:var(--space-5) auto 0;max-width:520px}
.clock{position:relative;margin-top:var(--space-4);padding:var(--space-4) 8px var(--space-3);
  border:var(--stroke-hairline) solid var(--line);border-radius:var(--radius-slab)}
.bell{position:absolute;top:-21px;width:20px;height:20px;border-radius:50%;
  border:var(--stroke-hairline) solid var(--accent-b);background:var(--surface)}
.bell.l{left:16%}.bell.r{right:16%}
.cells{display:grid;grid-template-columns:repeat(4,1fr)}
.cell+.cell{border-left:var(--stroke-hairline) solid var(--line)}
.num{display:block;font-size:clamp(30px,10.5vw,60px);line-height:1.1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.unit{display:block;margin-top:var(--space-1)}

/* schedule */
.plan{margin:var(--space-7) auto 0;max-width:520px;text-align:left}
.plan .label{text-align:center;margin-bottom:var(--space-3)}
.plan ol{list-style:none;border-top:var(--stroke-hairline) solid var(--line)}
.plan li{display:grid;grid-template-columns:1fr auto;gap:var(--space-1) var(--space-3);align-items:center;
  padding:var(--space-3) 0;border-bottom:var(--stroke-hairline) solid var(--line)}
.plan .d{white-space:nowrap;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted);line-height:18px}
.plan .n{grid-column:1/-1;grid-row:2;font-size:18px;line-height:24px}
.plan .n small{display:inline;margin-left:var(--space-2)}
.plan .n small{font-size:14px;line-height:20px;color:var(--ink-muted)}
.plan .s{display:flex;align-items:center;gap:var(--space-2);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted)}
.plan li.on .s{color:var(--ink)}
.plan li.past .n{color:var(--ink-muted)}
.star{width:16px;height:16px;fill:none;stroke:var(--accent-b);stroke-width:var(--stroke-hairline);stroke-linejoin:round}
.star-gap{width:16px;height:16px}

/* form */
.form{display:grid;gap:var(--space-4);text-align:left;margin:var(--space-5) auto 0;max-width:460px}
.field label{display:block;margin-bottom:var(--space-2)}
.input{display:flex;align-items:center;background:var(--paper);color:#000;
  border:var(--stroke-hairline) solid var(--line);border-radius:var(--radius-slab)}
.input:focus-within{outline:2px solid var(--ink);outline-offset:3px}
.input input{flex:1;min-width:0;font:inherit;font-size:18px;line-height:28px;color:#000;background:transparent;
  border:0;outline:0;padding:12px 14px;min-height:54px;border-radius:var(--radius-slab)}
.input input::placeholder{color:#8a8374;opacity:1}
.input .sfx{padding-right:14px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted);white-space:nowrap}
.err{font-size:14px;line-height:20px;min-height:20px;color:var(--ink);text-align:left}
.btn{font:inherit;font-size:13px;line-height:16px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;
  width:100%;min-height:56px;padding:0 var(--space-4);border-radius:var(--radius-slab);
  color:var(--paper);background:var(--forest);border:var(--stroke-hairline) solid var(--forest)}
.btn:hover{opacity:.92}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.btn[disabled]{opacity:.6;cursor:default}
.btn.ghost{color:var(--ink);background:transparent;border-color:var(--line)}
.after{max-width:460px;margin:var(--space-5) auto 0}

.foot{margin-top:var(--space-6)}
.demo{display:inline-block;margin-top:var(--space-2)}

@media (min-width:760px){
  :root{--gutter:32px}
  .corner.big{left:var(--space-7);bottom:var(--space-7);width:150px;height:150px}
  .corner.small{right:var(--space-7);bottom:calc(var(--space-7) + 60px);width:84px;height:84px}
  .stage{padding-bottom:260px}
}
@media (max-width:380px){.label{letter-spacing:.12em}}
</style>
</head>

<noscript><p class="caption" style="padding:24px;text-align:center">Julequizzen kræver JavaScript.</p></noscript>

<script>
"use strict";
/* ============ Opsætning ============
   Tider er dansk tid (CET, +01:00 i december).
   Antagelser: spørgsmål 2 og 3 åbner kl. 08.00 (som spørgsmål 1),
   og spørgsmål 3 lukker kl. 14.00, en time før lodtrækningen kl. 15.00. */
const T = s => new Date(s).getTime();
const QUIZ = [
  { id:"q1", no:1, title:"Hvor mange pebernødder er der i glasset?",
    hint:"Se glasset ved stationen, og skriv dit gæt.",
    prize:"Keramik", winners:4, kind:"int", unit:"pebernødder", placeholder:"fx 1250", min:1, max:100000,
    opens:T("2026-12-02T08:00:00+01:00"), closes:T("2026-12-03T11:00:00+01:00"), draw:T("2026-12-03T12:00:00+01:00") },
  { id:"q2", no:2, title:"Gæt vægten på pakken.",
    hint:"Præmierne ligger i pakken. Skriv vægten i kilo.",
    prize:"Toilettaske med Woods-produkter", prizeShort:"Toilettaske", winners:4, kind:"kg", unit:"kg", placeholder:"fx 2,4", min:0.01, max:500,
    opens:T("2026-12-09T08:00:00+01:00"), closes:T("2026-12-10T11:00:00+01:00"), draw:T("2026-12-10T12:00:00+01:00") },
  { id:"q3", no:3, title:"Hvor mange nisser er der på billedet?",
    hint:"Find det store board ved stationen, og tæl nisserne.",
    prize:"Bobler med logo", prizeShort:"Bobler", winners:4, kind:"int", unit:"nisser", placeholder:"fx 42", min:1, max:100000,
    opens:T("2026-12-16T08:00:00+01:00"), closes:T("2026-12-17T14:00:00+01:00"), draw:T("2026-12-17T15:00:00+01:00") }
];

/* Hvor svarene gemmes. "local" gemmer kun i den enkelte browser (demo). */
const BACKEND = "local";

/* ============ Hjælpere ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch(e){} };

/* Tidsrejse til test: ?nu=2026-12-09T10:00 (kun i demo) */
let clockOffset = 0;
(function(){
  const v = new URLSearchParams(location.search).get("nu");
  if (!v || BACKEND !== "local") return;
  const iso = /^\d{4}-\d\d-\d\dT\d\d:\d\d$/.test(v) ? v + ":00+01:00" : v;
  const t = new Date(iso).getTime();
  if (!isNaN(t)) clockOffset = t - Date.now();
})();
const now = () => Date.now() + clockOffset;

const dtf = new Intl.DateTimeFormat("da-DK",{timeZone:"Europe/Copenhagen",weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
function parts(ts){ const o={}; dtf.formatToParts(new Date(ts)).forEach(p=>o[p.type]=p.value); return o; }
const fmtDay  = ts => { const p=parts(ts); return `${p.weekday} d. ${p.day}. ${p.month}`; };
const fmtTime = ts => { const p=parts(ts); return `${p.hour}.${p.minute}`; };
const fmtWhen = ts => `${fmtDay(ts)} kl. ${fmtTime(ts)}`;
const shortDate = ts => { const p=parts(ts); return `${p.weekday.slice(0,3)} ${p.day}. ${p.month.slice(0,3)}`; };

function split(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  return { d:Math.floor(s/86400), h:Math.floor(s%86400/3600), m:Math.floor(s%3600/60), s:s%60 };
}

function parseGuess(raw, q){
  let s = String(raw).trim().replace(/\s/g,"");
  if (q.kind === "int"){ s = s.replace(/\./g,""); if(!/^\d+$/.test(s)) return NaN; return parseInt(s,10); }
  s = s.replace(",","."); if(!/^\d+(\.\d+)?$/.test(s)) return NaN; return parseFloat(s);
}
function fmtGuess(v, q){
  return q.kind === "int" ? v.toLocaleString("da-DK") + " " + q.unit
                          : String(v).replace(".",",") + " " + q.unit;
}

/* ============ Lager ============ */
const store = (function(){
  if (BACKEND === "local") {
    const K = "julequiz.svar";
    const all = () => { try { return JSON.parse(lsGet(K) || "{}"); } catch(e){ return {}; } };
    return {
      async get(id){ return all()[id] || null; },
      async save(id, doc){ const a = all(); a[id] = doc; lsSet(K, JSON.stringify(a)); }
    };
  }
  throw new Error("Ukendt BACKEND");
})();
const answerId = (qid, email) => qid + "__" + email.toLowerCase().replace(/[^a-z0-9@._+-]/g,"_");

/* ============ Fase ============ */
function phase(t){
  for (let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    if (t < q.opens) return { k: i===0 ? "before" : "between", next:q, prev:QUIZ[i-1] };
    if (t < q.closes) return { k:"open", q };
  }
  return { k:"done", prev:QUIZ[QUIZ.length-1] };
}
const drawLine = (q,t) => t < q.draw ? `Vinderne trækkes ${fmtDay(q.draw)} kl. ${fmtTime(q.draw)}.` : "Vinderne er trukket.";

/* ============ Tegning ============ */
const STAR = (cx,cy,R=10,r=4) => { let d=""; for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rad=i%2?r:R; d+=(i?"L":"M")+(cx+rad*Math.cos(a)).toFixed(2)+" "+(cy+rad*Math.sin(a)).toFixed(2)+" "; } return d+"Z"; };
const starIcon = () => `<svg class="star" viewBox="0 0 20 20" aria-hidden="true"><path d="${STAR(10,10,9,3.8)}"/></svg>`;

function drawGarland(){
  const W = document.documentElement.clientWidth;
  const n = W < 520 ? 3 : W < 900 ? 4 : 5;
  const span = W/n, sag = span*0.283, kinds = ["bauble","star","filled","bauble","star"];
  const R = span < 150 ? 8.5 : 10;
  let g = "", H = 0;
  for (let i=0;i<n;i++){
    const x0=i*span, x1=x0+span, mx=x0+span/2, my=sag/2, y1=my+16;
    g += `<path class="ln" d="M${x0.toFixed(1)} 0 Q${mx.toFixed(1)} ${sag.toFixed(1)} ${x1.toFixed(1)} 0"/><circle class="dot" cx="${x0.toFixed(1)}" cy="0" r="2.6"/>`;
    g += `<path class="ln" d="M${mx.toFixed(1)} ${my.toFixed(1)} v16"/>`;
    if (kinds[i]==="star"){ g += `<path class="bb" d="${STAR(mx,y1+R,R,R*.4)}"/>`; H=Math.max(H,y1+2*R); }
    else { g += `<rect class="ln" x="${(mx-2.6).toFixed(1)}" y="${y1.toFixed(1)}" width="5.2" height="3.6" rx=".8"/><circle class="bb${kinds[i]==="filled"?" fill":""}" cx="${mx.toFixed(1)}" cy="${(y1+3.6+R).toFixed(1)}" r="${R}"/>`; H=Math.max(H,y1+3.6+2*R); }
  }
  g += `<circle class="dot" cx="${W}" cy="0" r="2.6"/>`;
  H = Math.ceil(H+4);
  $("#garland").innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}

function setTheme(theme){
  document.documentElement.dataset.theme = theme;
  $("#logo").src = theme==="forest" ? "assets/selected-logo-hat-white.svg" : "assets/selected-logo-hat-black.svg";
  $('meta[name="theme-color"]').content = theme==="forest" ? "#1F3A2E" : "#F4EFE6";
}

const flake = (id,cls="divider") => `<svg class="flake ${cls}" aria-hidden="true"><use href="#flake-${id}"/></svg>`;

/* ---- kalender ---- */
function renderPlan(t){
  const rows = QUIZ.map(q => {
    const open = t>=q.opens && t<q.closes, past = t>=q.closes;
    const status = open ? "Åben" : past ? "Lukket" : "Åbner";
    return `<li class="${open?"on":past?"past":""}">
      <span class="d">${esc(shortDate(q.opens))}</span>
      <span class="n">Spørgsmål ${q.no}<small>${esc(q.prizeShort||q.prize)}</small></span>
      <span class="s">${open?starIcon():'<i class="star-gap"></i>'}${status}</span></li>`;
  }).join("");
  $("#plan").innerHTML = `<p class="label">Tre onsdage i december</p><ol>${rows}</ol>`;
}

/* ---- søvn ---- */
function cdCells(ms){
  const c = split(ms);
  const cell = (k,v,u) => `<div class="cell"><span class="num" data-cd="${k}">${pad(v)}</span><span class="unit label">${u}</span></div>`;
  return cell("d",c.d,"dage")+cell("h",c.h,"timer")+cell("m",c.m,"min")+cell("s",c.s,"sek");
}
function renderSleep(ph,t){
  const done = ph.k==="done";
  const note = ph.prev ? `<p class="caption">Spørgsmål ${ph.prev.no} er lukket. ${esc(drawLine(ph.prev,t))}</p>` : "";
  if (done){
    return `<div class="head">
      <h1 class="headline">Nissen holder juleferie.</h1>
      <div class="zzz" aria-hidden="true"><span>z</span><span>z</span><span>Z</span></div>
      <p class="body">Tak fordi du var med i år.</p>${note}${flake("fern")}</div>`;
  }
  return `<div class="head">
    <h1 class="headline">Quiz-nissen sover.</h1>
    <div class="zzz" aria-hidden="true"><span>z</span><span>z</span><span>Z</span></div>
    <p class="body">Kom tilbage, når vækkeuret ringer.</p>${note}
    <div class="alarm">
      <p class="label">Vækkeuret ringer ${esc(fmtWhen(ph.next.opens))}</p>
      <div class="clock" role="timer" aria-label="Tid til vækkeuret ringer"><i class="bell l"></i><i class="bell r"></i>
        <div class="cells" id="cells">${cdCells(ph.next.opens - t)}</div></div>
    </div></div>`;
}

/* ---- åben ---- */
function formHtml(q, me, guess){
  const val = guess!=null ? String(guess).replace(".",",") : "";
  return `<form class="form" id="form" novalidate>
    <div class="field"><label class="label" for="f-name">Navn</label>
      <div class="input"><input id="f-name" name="name" type="text" autocomplete="name" value="${esc(me.name||"")}" maxlength="80"></div></div>
    <div class="field"><label class="label" for="f-email">Arbejdsmail</label>
      <div class="input"><input id="f-email" name="email" type="email" autocomplete="email" inputmode="email" value="${esc(me.email||"")}" maxlength="120"></div></div>
    <div class="field"><label class="label" for="f-guess">Dit gæt</label>
      <div class="input"><input id="f-guess" name="guess" type="text" inputmode="${q.kind==="int"?"numeric":"decimal"}" autocomplete="off" placeholder="${esc(q.placeholder)}" value="${esc(val)}" maxlength="12"><span class="sfx">${esc(q.unit)}</span></div></div>
    <p class="err" id="err" role="alert"></p>
    <button class="btn" type="submit" id="send">Send mit gæt</button>
  </form>`;
}
function confirmHtml(q, doc){
  const first = (doc.name||"").trim().split(/\s+/)[0];
  return `<div class="head">
    <p class="label">Dit gæt er modtaget</p>
    <h1 class="headline">Tak${first?", "+esc(first):""}.</h1>
    ${flake("fern")}
    <p class="body">Du har gættet på ${esc(fmtGuess(doc.guess,q))}.</p>
    <p class="caption">Du kan rette dit gæt frem til ${esc(fmtWhen(q.closes))}. ${esc(drawLine(q, now()))}</p>
    <div class="after"><button class="btn ghost" type="button" id="edit">Ret mit gæt</button></div></div>`;
}
function renderOpen(q,t){
  return `<div class="head" id="qhead">
    <p class="label">Spørgsmål ${q.no} af ${QUIZ.length}</p>
    <h1 class="headline">${esc(q.title)}</h1>
    ${flake("fern")}
    <p class="body">${esc(q.hint)}</p>
    <div class="prize"><p class="label">Præmie · ${q.winners} vindere</p><p class="name">${esc(q.prize)}</p></div>
  </div>
  <div id="qbody"></div>
  <p class="caption" id="closing" style="margin-top:var(--space-4)"></p>`;
}

function bindForm(q){
  const form = $("#form"); if(!form) return;
  form.addEventListener("submit", async ev => {
    ev.preventDefault();
    const err = $("#err"), btn = $("#send");
    const name = form.name.value.trim(), email = form.email.value.trim();
    const guess = parseGuess(form.guess.value, q);
    const fail = (m, el) => { err.textContent = m; if(el) el.focus(); };
    if (name.length < 2) return fail("Skriv dit navn.", form.name);
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail("Skriv en gyldig mail, så vi kan finde dig, hvis du vinder.", form.email);
    if (isNaN(guess) || guess < q.min || guess > q.max) return fail(q.kind==="int" ? "Skriv dit gæt som et helt tal." : "Skriv vægten i kilo, fx 2,4.", form.guess);
    if (now() >= q.closes) return fail("Beklager, spørgsmålet er lige lukket.");
    err.textContent = ""; btn.disabled = true; btn.textContent = "Sender";
    try {
      const id = answerId(q.id, email), prev = await store.get(id);
      const doc = { q:q.id, name, email, guess, at:Date.now(), first: prev ? prev.first : Date.now() };
      await store.save(id, doc);
      lsSet("julequiz.me", JSON.stringify({name,email}));
      showConfirm(q, doc);
    } catch(e){
      btn.disabled = false; btn.textContent = "Send mit gæt";
      fail("Det lykkedes ikke at sende dit gæt. Prøv igen om lidt.");
    }
  });
}
function showForm(q, doc){
  const me = (()=>{ try{ return JSON.parse(lsGet("julequiz.me")||"{}"); }catch(e){ return {}; } })();
  $("#qhead").hidden = false;
  $("#qbody").innerHTML = formHtml(q, doc || me, doc ? doc.guess : null)
    + `<p class="caption" style="margin-top:var(--space-4)">Åbent til ${esc(fmtWhen(q.closes))}. ${esc(drawLine(q, now()))}</p>`;
  bindForm(q);
}
function showConfirm(q, doc){
  $("#qhead").hidden = true;
  $("#qbody").innerHTML = confirmHtml(q, doc);
  $("#edit").addEventListener("click", () => { showForm(q, doc); const g=$("#f-guess"); g && g.focus(); });
  window.scrollTo({top:0, behavior:"smooth"});
}
async function loadOwn(q){
  showForm(q);
  const me = (()=>{ try{ return JSON.parse(lsGet("julequiz.me")||"{}"); }catch(e){ return {}; } })();
  if (!me.email) return;
  try { const doc = await store.get(answerId(q.id, me.email)); if (doc && $("#qbody")) showConfirm(q, doc); } catch(e){}
}

/* ============ Hovedløkke ============ */
let shownKey = null;
function render(){
  const t = now(), ph = phase(t);
  const key = ph.k + (ph.q ? ph.q.id : ph.next ? ph.next.id : "x");
  if (key !== shownKey){
    shownKey = key;
    const awake = ph.k === "open";
    setTheme(awake ? "cream" : "forest");
    $("#view").innerHTML = awake ? renderOpen(ph.q,t) : renderSleep(ph,t);
    renderPlan(t);
    if (awake) loadOwn(ph.q);
  }
  /* tæl ned uden at røre formularen */
  if (ph.k === "open"){
    const c = split(ph.q.closes - t), el = $("#closing");
    if (el) el.textContent = c.d ? `Lukker om ${c.d} d ${c.h} t ${pad(c.m)} m.` : `Lukker om ${c.h} t ${pad(c.m)} m ${pad(c.s)} s.`;
  } else if (ph.next){
    const c = split(ph.next.opens - t);
    for (const k of ["d","h","m","s"]){ const el = document.querySelector(`[data-cd="${k}"]`); if (el) el.textContent = pad(c[k]); }
  }
}

$("#foot").innerHTML = "Selected · Julequiz 2026" + (BACKEND==="local" ? '<br><span class="demo">Demo: svar gemmes kun i denne browser</span>' : "");
drawGarland();
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(drawGarland, 120); });
render();
setInterval(render, 1000);
requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add("ready")));
</script>
</body>
